const call=(tok,fn,args)=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
  body:JSON.stringify({tok:tok,fn:fn,args:args})})
  .then(r=>r.json().catch(()=>{throw new Error('Balasan server tidak valid. Pastikan deployment diatur "Anyone" dan API_URL benar.')}),

<script>
const NI={d:'grid',i:'building','m:Siswa':'users','m:Guru':'user','m:Periode':'cal','m:Mapel':'book','n:Tahfidz':'quran','n:Tahsin':'mic','n:Diniyah':'scroll',r:'print',l:'table',s:'gear'};
function lvHtml(){const t=(i,n,d,w,x)=>`<div class=ft style="--d:${d}s"><div class=si>${ic(i,20)}</div><div><b>${n}</b><span>${x}</span><u style="--w:${w}%"></u></div></div><div class=pp></div>`;
  return `<h2>Satu alur, rapor santri rapi</h2><p>Dari input nilai hingga rapor PDF siap cetak.</p><div class=fl>`+t('quran','Tahfidz',0,92,'Kelancaran · Tajwid · Pencapaian')+t('mic','Tahsin',.5,85,'Makhorij · Tajwid · Kelancaran')+t('scroll','Diniyah',1,88,'Mafhum · Membaca · Menulis')+`<div class="ft pdf"><div class=si>${ic('print',20)}</div><div><b>Rapor PDF</b><span>Otomatis, tersimpan di Google Drive</span></div></div></div>`}
function dash(){
  const S=D.setting||{},P=D.Periode.find(x=>x.Aktif=='Y'),K={};D.Siswa.forEach(s=>K[s.Kelas||'-']=(K[s.Kelas||'-']||0)+1);
  const mx=Math.max(1,...Object.values(K)),h=new Date().getHours(),sp=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  const st=(i,n,l,c)=>`<div class=st style="--c:${c}"><div class=si>${ic(i,22)}</div><div><b data-n=${n}>0</b><span>${l}</span></div></div>`;
  const qa=(i,l,g)=>`<a class=qa onclick="go('${g}')">${ic(i,20)}<span>${l}</span></a>`;
  $('#m').innerHTML=`<div class=hero><div><small>${sp},</small><h2>${e(D.nama)}</h2><p>${e(S.NamaSekolah||'Rapor Tahfidz, Tahsin & Diniyah')}${P?' · '+e(P.Tahun)+' '+e(P.Semester):''}</p></div>${logoU()?`<img src="${e(logoU())}" onerror="this.remove()">`:''}</div>
  <div class=sg>${st('users',D.Siswa.length,'Siswa','#1f6f54')}${st('user',D.Guru.length,'Guru','#b8892f')}${st('book',D.Mapel.length,'Mapel Diniyah','#2e75b6')}${st('cal',Object.keys(K).length,'Kelas','#7a4fb3')}</div>
  <div class=dg><div class=card><h3>Siswa per Kelas</h3>${Object.keys(K).sort().map(k=>`<div class=bw><span>${e(k)}</span><i style="--w:${K[k]/mx*100}%"></i><em>${K[k]}</em></div>`).join('')||'<p style="color:var(--mut)">Belum ada data siswa.</p>'}</div>
  <div class=card><h3>Akses Cepat</h3><div class=qg>${qa('quran','Nilai Tahfidz','n:Tahfidz')}${qa('mic','Nilai Tahsin','n:Tahsin')}${qa('scroll','Nilai Diniyah','n:Diniyah')}${qa('print','Cetak Rapor','r')}${qa('users','Data Siswa','m:Siswa')}${qa('gear','Pengguna','s')}</div></div></div>`;
  document.querySelectorAll('.st b').forEach(b=>{const n=+b.dataset.n;let i=0;const t=setInterval(()=>{i=Math.min(n,i+Math.max(1,Math.ceil(n/20)));b.textContent=i;if(i>=n)clearInterval(t)},30)});
}
</script>
<script>
const logoU=()=>{const S=D.setting||{};return S.LogoUrl||(S.LogoID?'https://lh3.googleusercontent.com/d/'+S.LogoID:'')};
function tg(f){document.body.classList.toggle('mo',f===undefined?!document.body.classList.contains('mo'):f)}
function go(id){
  PG=id;tg(false);{const x=MENU.flatMap(g=>g[1]).find(z=>z[0]==id),tt_=$('#tt');if(tt_)tt_.textContent=x?x[1]:'Rapor Tahfidz'}
  $('#nav').innerHTML=`<div class=br><div class="mark${logoU()?' im':''}">${mk(logoU())}</div><div>Rapor Tahfidz${(D.setting||{}).NamaSekolah?`<small>${e(D.setting.NamaSekolah)}</small>`:''}</div></div>`+
    MENU.map(([g,it])=>`<b>${g}</b>`+it.map(([i,l])=>`<a class="${i==id?'on':''}" onclick="go('${i}')">${ic(NI[i])}${l}</a>`).join('')).join('')+
    `<div class=us>${e(D.nama)}<br><a onclick="logout()">Keluar</a></div>`;
  const [t,k]=id.split(':');
  t=='d'?dash():t=='m'?master(k):t=='n'?nilaiPage(k):t=='r'?raporPage():t=='l'?legerPage():t=='i'?identitas():setting();
}
const pLabel=p=>({ID:p.ID,Nama:p.Tahun+' · '+p.Semester});

function master(k){
  const [t,f]=M[k],L=D[k]||[];
  const cols=k=='Periode'?[['Tahun Pelajaran & Semester',r=>e(r.Tahun)+' · '+e(r.Semester)],['Aktif',r=>r.Aktif=='Y'?'✔':'']]
    :f.map(([n,l,c])=>[l,r=>c=='c'?(r[n]=='Y'?'✔':''):c=='f'?(r[n]?'✔ Terunggah':''):c=='k'?(e(r[n])||'Semua kelas'):e(r[n])]);
  const tools=k=='Siswa'?`<div class="card"><div class=bar2><button class=s onclick="tpl()">⬇ Download Template</button>
    <button class=s onclick="$('#imp').click()">⬆ Impor Data (Excel)</button>
    <input id=imp type=file accept=".xlsx,.xls" hidden onchange="impor(this)">
    <span style="color:var(--mut);font-size:12px">Gunakan template Excel (kolom: NISN, Nama, Kelas). NISN yang sudah ada akan diperbarui.</span></div></div>`:'';
  $('#m').innerHTML=`<div class="ph ph2"><div><h2>${t}</h2><span>${L.length} data</span></div><button onclick="tambah('${k}')">＋ Tambah Data</button></div>`+tools+`<dialog id=dlg><h3 id=dt style="margin:0 0 16px">Tambah Data</h3><input type=hidden id=f_ID>
  <div class=dlgf>${f.map(([n,l,c,o])=>c=='f'?`<div><span style="font-size:12px;color:var(--mut)">${l} (gambar PNG/JPG)</span>
    <div style="display:flex;gap:10px;align-items:center;margin-top:4px"><input type=hidden id=f_${n}>
    <button type=button class=s onclick="$('#tf').click()">⬆ Unggah TTD</button><span id=tp style="font-size:12px;color:var(--mut)">Belum ada TTD</span></div>
    <input id=tf type=file accept="image/*" hidden onchange="upTtd(this)"></div>`:c=='s'?`<label>${l}<select id=f_${n}>${o.map(x=>`<option>${x}</option>`).join('')}</select></label>`
    :c=='k'?`<label>${l}<select id=f_${n}><option value="">Semua kelas</option>${[...new Set(D.Siswa.map(z=>z.Kelas))].filter(Boolean).sort().map(x=>`<option>${e(x)}</option>`).join('')}</select></label>`
    :`<label>${l}<input id=f_${n} ${c=='c'?'type=checkbox':''}></label>`).join('')}
  </div><div class=dlga><button class=s onclick="$('#dlg').close()">Batal</button><button onclick="sv('${k}')">Simpan</button></div></dialog>
  <div class=card><input id=q placeholder="Cari…" oninput="cari()" style="margin-bottom:12px;width:260px">
  <div class=tw><table><thead><tr><th>#</th>${cols.map(x=>`<th>${x[0]}</th>`).join('')}<th></th></tr></thead><tbody id=tbd>
  ${L.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(x=>`<td>${x[1](r)}</td>`).join('')}
  <td><button class=s onclick="ed('${k}',${i})">Edit</button><button class=d onclick="rm('${k}','${r.ID}')">Hapus</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
</script>
<script>
function cari(){const q=$('#q').value.toLowerCase();document.querySelectorAll('#tbd tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function tambah(k){const d=$('#dlg');
  d.querySelectorAll('input:not([type=file]),select').forEach(el=>{if(el.type=='checkbox')el.checked=false;else if(el.tagName=='SELECT')el.selectedIndex=0;else el.value=''});
  $('#dt').textContent='Tambah Data';if($('#tp'))ttdStat();d.showModal()}
function ed(k,i){const r=D[k][i];$('#f_ID').value=r.ID;M[k][1].forEach(([n,,c])=>{const el=$('#f_'+n);
  if(c=='c')el.checked=r[n]=='Y';
  else if(c=='f'){el.value=r[n]||'';ttdStat()}
  else{if((c=='s'||c=='k')&&r[n]&&![...el.options].some(o=>o.value==r[n]))el.add(new Option(r[n]));el.value=r[n]||''}});$('#dt').textContent='Edit Data';$('#dlg').showModal()}
async function sv(k){
  const o={ID:$('#f_ID').value};
  M[k][1].forEach(([n,,c])=>o[n]=c=='c'?($('#f_'+n).checked?'Y':''):$('#f_'+n).value.trim());
  D[k]=await api('save',k,o);toast('Tersimpan');try{$('#dlg').close()}catch(x){}master(k);
}
async function rm(k,id){if(!confirm('Hapus data ini?'))return;D[k]=await api('del',k,id);toast('Dihapus');master(k)}

function dl(n,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;document.body.appendChild(a);a.click();a.remove()}
function tpl(){
  if(!window.XLSX){toast('Pustaka Excel belum termuat, coba lagi sebentar',1);return}
  const ws={},N=500;
  [['A1','NISN'],['B1','Nama'],['C1','Kelas'],['A2','3129424312'],['B2','CONTOH NAMA SISWA'],['C2','VII']]
    .forEach(([k,v])=>ws[k]={t:'s',v});
  for(let r=3;r<=N+1;r++)ws['A'+r]={t:'s',v:'',z:'@'};
  ws['!ref']='A1:C'+(N+1);ws['!cols']=[{wch:18},{wch:36},{wch:10}];
  const ps=XLSX.utils.aoa_to_sheet([['Petunjuk'],['1. Isi data di sheet "Siswa", mulai baris 2 (baris contoh boleh dihapus/diganti).'],
    ['2. Kolom: NISN, Nama, Kelas. Jangan ubah judul kolom.'],['3. NISN yang sudah ada di aplikasi akan diperbarui, yang baru ditambahkan.']]);
  ps['!cols']=[{wch:90}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Siswa');XLSX.utils.book_append_sheet(wb,ps,'Petunjuk');
  dl('template_siswa.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
</script>
<script>
function impor(inp){
  const f=inp.files[0];if(!f)return;
  if(!window.XLSX){toast('Pustaka Excel belum termuat, coba lagi sebentar',1);inp.value='';return}
  const fr=new FileReader();
  fr.onload=async()=>{
    let R;
    try{const wb=XLSX.read(fr.result,{type:'array'});R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
    catch(x){toast('File Excel tidak bisa dibaca',1);inp.value='';return}
    const h=(R.shift()||[]).map(x=>String(x).trim().toLowerCase()),ix=k=>h.indexOf(k);
    if(ix('nama')<0){toast('Header harus: NISN, Nama, Kelas',1);inp.value='';return}
    const g=(r,k)=>ix(k)<0?'':String(r[ix(k)]==null?'':r[ix(k)]).trim();
    const rows=R.map(r=>({NISN:g(r,'nisn'),Nama:g(r,'nama'),Kelas:g(r,'kelas')})).filter(r=>r.Nama);
    if(!rows.length||!confirm(`Impor ${rows.length} siswa?`)){inp.value='';return}
    try{const res=await api('importSiswa',rows);D.Siswa=res.list;toast(`${res.a} ditambah, ${res.u} diperbarui`);master('Siswa')}catch(x){inp.value=''}
  };
  fr.readAsArrayBuffer(f);
}

function fMp(){const l=D.Mapel.filter(m=>!m.Kelas||m.Kelas==$('#kl').value);$('#mp').innerHTML=l.map(m=>`<option value="${e(m.ID)}">${e(m.Nama)}</option>`).join('')}
function filt(mapel){
  const kel=[...new Set(D.Siswa.map(s=>s.Kelas))].sort(),aP=(D.Periode.find(x=>x.Aktif=='Y')||{}).ID;
  const sel=(id,l,a,v,x='')=>`<label>${l}<select id=${id} ${x}>${a.map(x=>{const val=x.ID||x;
    return `<option value="${e(val)}" ${val==v?'selected':''}>${e(x.Nama||x)}</option>`}).join('')}</select></label>`;
  return sel('per','Tahun Pelajaran & Semester',D.Periode.map(pLabel),aP)+sel('kl','Kelas',kel,'',mapel?'onchange="fMp()"':'')+(mapel?sel('mp','Mapel Diniyah',D.Mapel.filter(m=>!m.Kelas||m.Kelas==kel[0])):'');
}
const cur=()=>({per:$('#per').value,kl:$('#kl').value,mp:$('#mp')?$('#mp').value:''});
</script>
<script>
function nilaiPage(k){
  $('#m').innerHTML=hdr(N[k][0],'Pilih periode dan kelas')+`<div class=card><div class=bar2>${filt(k=='Diniyah')}
  <button onclick="loadN('${k}')">Tampilkan</button>
  <button class=s onclick="tplN('${k}')">⬇ Download Template</button>
  <button class=s onclick="$('#impn').click()">⬆ Impor Excel</button>
  <input id=impn type=file accept=".xlsx,.xls" hidden onchange="imporN('${k}',this)"></div>
  <p style="margin:10px 0 0;font-size:12px;color:var(--mut)">Template berisi daftar siswa sesuai periode, kelas${k=='Diniyah'?' dan mapel':''} yang dipilih (nilai yang sudah tersimpan ikut terisi). Impor mencocokkan baris lewat NISN (atau nama), lalu menyimpan nilai.</p></div><div id=hasil></div>`;
}
const xl=()=>{if(window.XLSX)return true;toast('Pustaka Excel belum termuat, coba lagi sebentar',1);return false};
const xlBlob=wb=>new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
const fnm=t=>String(t).replace(/[^\w]+/g,'_').replace(/^_|_$/g,'');
const perNama=id=>{const p=D.Periode.find(x=>x.ID==id)||{};return (p.Tahun||'')+' '+(p.Semester||'')};

async function tplN(k){
  if(!xl())return;
  const P=cur(),c=N[k][1];
  if(!P.kl||(k=='Diniyah'&&!P.mp)){toast('Pilih periode, kelas'+(k=='Diniyah'?' dan mapel':'')+' dulu',1);return}
  const r=await api('nilai',k,P.per,P.kl,P.mp);
  if(!r.siswa.length){toast('Tidak ada siswa di kelas ini',1);return}
  const mp=(D.Mapel.find(x=>x.ID==P.mp)||{}).Nama||'';
  const rows=r.siswa.map(s=>{const d=r.data.find(x=>x.SiswaID==s.ID)||{};
    return [s.NISN||'',s.Nama,...c.map(([n,y])=>{const v=d[n];return y=='n'&&v!==''&&v!=null&&!isNaN(Number(v))?Number(v):(v||'')})]});
  const ws=XLSX.utils.aoa_to_sheet([['NISN','Nama',...c.map(x=>x[0])],...rows]);
  ws['!cols']=[{wch:16},{wch:36},...c.map(x=>({wch:x[1]=='t'?32:12}))];
  const ps=XLSX.utils.aoa_to_sheet([['Petunjuk'],
    [`Template ${N[k][0]} · ${perNama(P.per)} · Kelas ${P.kl}${mp?' · '+mp:''}`],
    ['1. Isi kolom nilai pada sheet "Nilai". Jangan ubah judul kolom, NISN, dan Nama.'],
    ['2. Nilai angka 0-100. Sel yang dikosongkan tidak mengubah nilai yang sudah tersimpan.'],
    ['3. Impor di menu yang sama dengan periode, kelas'+(k=='Diniyah'?' dan mapel':'')+' yang sama.']]);
  ps['!cols']=[{wch:90}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Nilai');XLSX.utils.book_append_sheet(wb,ps,'Petunjuk');
  dl(fnm(`template_${k}_${P.kl}${mp?'_'+mp:''}`)+'.xlsx',xlBlob(wb));
}

function imporN(k,inp){
  const f=inp.files[0];if(!f)return;
  if(!xl()){inp.value='';return}
  const P=cur(),c=N[k][1];
  if(!P.kl||(k=='Diniyah'&&!P.mp)){toast('Pilih periode, kelas'+(k=='Diniyah'?' dan mapel':'')+' dulu',1);inp.value='';return}
  const fr=new FileReader();
  fr.onload=async()=>{
    let R;
    try{const wb=XLSX.read(fr.result,{type:'array'});R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
    catch(x){toast('File Excel tidak bisa dibaca',1);inp.value='';return}
    const h=(R.shift()||[]).map(x=>String(x).trim().toLowerCase()),ix=n=>h.indexOf(n.toLowerCase());
    if(ix('nisn')<0&&ix('nama')<0){toast('Header harus memuat NISN dan/atau Nama. Gunakan template.',1);inp.value='';return}
    if(!c.some(([n])=>ix(n)>=0)){toast('Kolom nilai tidak ditemukan. Gunakan template.',1);inp.value='';return}
    try{await loadN(k)}catch(x){inp.value='';return}
    const byN={},byNm={};
    document.querySelectorAll('#hasil tr[data-id]').forEach(tr=>{
      const s=D.Siswa.find(x=>x.ID==tr.dataset.id)||{};
      if(s.NISN)byN[String(s.NISN).trim()]=tr;byNm[String(s.Nama).trim().toUpperCase()]=tr});
    let ok=0,skip=0,bad=0;
    R.forEach(r=>{
      const nisn=ix('nisn')<0?'':String(r[ix('nisn')]==null?'':r[ix('nisn')]).trim(),
            nm=ix('nama')<0?'':String(r[ix('nama')]==null?'':r[ix('nama')]).trim().toUpperCase();
      if(!nisn&&!nm)return;
      const tr=(nisn&&byN[nisn])||(nm&&byNm[nm]);
      if(!tr){skip++;return}
      let any=false;
      c.forEach(([n,y])=>{
        const j=ix(n);if(j<0)return;
        let v=String(r[j]==null?'':r[j]).trim();if(v==='')return;
        if(y=='n'){const x=Number(v.replace(',','.'));if(isNaN(x)||x<0||x>100){bad++;return}v=String(x)}
        tr.querySelector(`input[data-k=${n}]`).value=v;any=true});
      if(any)ok++;
    });
    if(!ok){toast('Tidak ada baris yang cocok dengan siswa di kelas ini',1);inp.value='';return}
    if(!confirm(`Simpan nilai ${ok} siswa?`+(skip?`\n${skip} baris tidak cocok dan dilewati.`:'')+(bad?`\n${bad} nilai tidak valid dilewati.`:''))){
      await loadN(k);inp.value='';return}
    try{await svN(k);await loadN(k)}catch(x){}
    inp.value='';
  };
  fr.readAsArrayBuffer(f);
}

async function loadN(k){
  CUR=cur();const r=await api('nilai',k,CUR.per,CUR.kl,CUR.mp),c=N[k][1];
  $('#hasil').innerHTML=`<div class=card><div class=tw><table><thead><tr><th>#</th><th>Nama</th>${c.map(x=>`<th>${x[0]}</th>`).join('')}</tr></thead><tbody>
  ${r.siswa.map((s,i)=>{const d=r.data.find(x=>x.SiswaID==s.ID)||{};
  return `<tr data-id="${s.ID}"><td>${i+1}</td><td>${e(s.Nama)}</td>${c.map(([n,y])=>
   `<td><input class=${y} data-k=${n} value="${e(d[n])}" ${y=='n'?'type=number min=0 max=100':''}></td>`).join('')}</tr>`}).join('')}
  </tbody></table></div><p><button onclick="svN('${k}')">Simpan Nilai</button></p></div>`;
}
async function svN(k){
  const rows=[...document.querySelectorAll('#hasil tr[data-id]')].map(tr=>{
    const o={SiswaID:tr.dataset.id};tr.querySelectorAll('input').forEach(i=>o[i.dataset.k]=i.value);return o});
  await api('saveNilai',k,CUR.per,CUR.mp,rows);toast('Nilai tersimpan');
}

const rpOpt=()=>({ttd:$('#rp_t').checked?'Y':''});

async function upTtd(inp){
  const f=inp.files[0];if(!f)return;let d;
  try{d=await resizeImg(f,300)}catch(x){toast(x.message,1);inp.value='';return}
  try{const id=await api('uploadTtd',d.split(',')[1]);$('#f_TtdID').value=id;
    $('#tp').innerHTML=`<img src="${d}" style="height:40px;vertical-align:middle;border:1px solid var(--ln);border-radius:6px;background:#fff"> ✔ Terunggah — klik Simpan`;
    toast('TTD terunggah, klik Simpan')}catch(x){}
  inp.value='';
}

function resizeImg(file,max){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/png'))};
  im.onerror=()=>no(new Error('File bukan gambar'));im.src=u})}
async function upLogo(inp){
  const f=inp.files[0];if(!f)return;let d;
  try{d=await resizeImg(f,400)}catch(x){toast(x.message,1);inp.value='';return}
  try{const r=await api('uploadLogo',d.split(',')[1]);D.setting=Object.assign({},D.setting,r);toast('Logo terunggah');setLoginLogo(logoU());go('i')}catch(x){inp.value=''}
}

<script>
function legerPage(){
  const kel=[...new Set(D.Siswa.map(s=>s.Kelas))].filter(Boolean).sort(),aP=(D.Periode.find(x=>x.Aktif=='Y')||{}).ID;
  $('#m').innerHTML=hdr('Cetak Leger','Rekap nilai tersimpan per tahun pelajaran & semester (Excel)')+`<div class=card><div class=bar2>
  <label>Tahun Pelajaran & Semester<select id=lper>${D.Periode.map(p=>`<option value="${e(p.ID)}" ${p.ID==aP?'selected':''}>${e(p.Tahun)} · ${e(p.Semester)}</option>`).join('')}</select></label>

  <button onclick="unduhLeger()">⬇ Unduh Leger (Excel)</button></div>
  <p style="margin:10px 0 0;font-size:12px;color:var(--mut)">Isi leger: nilai Tahfidz, Tahsin, dan Diniyah yang sudah tersimpan untuk periode yang dipilih.</p></div>`;
}
async function unduhLeger(){
  if(!xl())return;
  const per=$('#lper').value,kl=$('#lkl').value;
  if(!per){toast('Belum ada tahun pelajaran. Tambahkan di Data Master.',1);return}
  const r=await api('leger',per),S=D.setting||{},P=D.Periode.find(x=>x.ID==per)||{};
  const kels=kl?[kl]:[...new Set(D.Siswa.map(s=>s.Kelas))].filter(Boolean).sort();
  if(!kels.length){toast('Belum ada data siswa',1);return}
  const nv=v=>v===''||v==null?'':(isNaN(Number(v))?v:Number(v)),wb=XLSX.utils.book_new();
  kels.forEach(kelas=>{
    const sis=D.Siswa.filter(s=>s.Kelas==kelas).sort((a,b)=>String(a.Nama).localeCompare(b.Nama)),
          mp=D.Mapel.filter(m=>!m.Kelas||m.Kelas==kelas),
          G=[['TAHFIDZ',[['Kelancaran',1],['Tajwid',1],['Pencapaian',0],['Catatan',0]],'Tahfidz'],
             ['TAHSIN',[['Kelancaran',1],['Makhorij',1],['Tajwid',1],['Catatan',0]],'Tahsin']];
    // kolom: [grup, judul, kunci, angka?, sumber, mapelId]
    const cols=[];
    G.forEach(([g,l,src])=>l.forEach(([n,num])=>cols.push([g,n,n,num,src,''])));
    mp.forEach(m=>[['Mafhum'],['Membaca'],['Menulis']].forEach(([n])=>cols.push(['DINIYAH - '+m.Nama,n,n,1,'Diniyah',m.ID])));
    const top=['No','NISN','Nama','Kelas',...cols.map(c=>c[0])],sub=['','','','',...cols.map(c=>c[1])];
    const body=sis.map((s,i)=>[i+1,s.NISN||'',s.Nama,s.Kelas,...cols.map(([g,n,key,num,src,mid])=>{
      const d=r[src].find(x=>x.SiswaID==s.ID&&(src!='Diniyah'||x.MapelID==mid));
      const v=d?d[key]:'';return num?nv(v):(v||'')})]);
    const aoa=[['LEGER NILAI TAHFIDZ, TAHSIN DAN DINIYAH'],[S.NamaSekolah||''],[`Tahun Pelajaran ${P.Tahun||''} · Semester ${P.Semester||''} · Kelas ${kelas}`],[],top,sub,...body];
    const ws=XLSX.utils.aoa_to_sheet(aoa),mg=[];
    for(let c=0;c<4;c++)mg.push({s:{r:4,c},e:{r:5,c}});
    let i=4;while(i<top.length){let j=i;while(j+1<top.length&&top[j+1]===top[i])j++;if(j>i)mg.push({s:{r:4,c:i},e:{r:4,c:j}});i=j+1}
    ws['!merges']=mg;
    ws['!cols']=[{wch:5},{wch:14},{wch:34},{wch:8},...cols.map(c=>({wch:c[3]?11:26}))];
    XLSX.utils.book_append_sheet(wb,ws,String(kelas).replace(/[\[\]:*?\/\\]/g,'').slice(0,31)||'Kelas');
  });
  dl(fnm(`Leger_${kl||'Semua_Kelas'}_${P.Tahun||''}_${P.Semester||''}`)+'.xlsx',xlBlob(wb));
  toast('Leger diunduh');
}
